services:
  - type: web
    name: learnhub-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.webhook:app --bind 0.0.0.0:$PORT
    envVars:
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: VERIFY_TOKEN
        value: learnhub_verify
